name: Import legacy WordPress images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-wordpress-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download and validate original images
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          map_file=".wp-image-map.txt"
          trap 'rm -rf "$stage"' EXIT

          cat > "$map_file" <<'IMAGE_MAP'
          img_1085.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1085.jpg
          img_1099-1.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1099-1.jpg
          img_1094.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1094.jpg
          untitled.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/untitled.png
          img_1087.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1087.jpg
          img_1100.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1100.jpg
          124d3f2212a12b1a95b3e7b8dbecf4e0.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/124d3f2212a12b1a95b3e7b8dbecf4e0.jpg
          images-1.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/images-1.jpg
          img_1089.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1089.jpg
          download.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/download.png
          logo-slp-1.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/logo-slp-1.png
          75753zedercorporation-3-1.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/75753zedercorporation-3-1.jpg
          xun1552571609.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/xun1552571609.png
          maillogo1.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/maillogo1.jpg
          logo-1.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/06/logo-1.png
          1.png|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/1.png
          img_1080-1.jpg|https://khuonmauhoalong.wordpress.com/wp-content/uploads/2023/05/img_1080-1.jpg
          IMAGE_MAP

          count=0
          while IFS='|' read -r filename url; do
            [ -n "$filename" ] || continue
            echo "Downloading $filename"
            relative_path="${url#https://khuonmauhoalong.wordpress.com/}"
            upload_path="${relative_path#wp-content/uploads/}"
            candidates=(
              "https://i0.wp.com/khuonmauhoalong.wordpress.com/${relative_path}?ssl=1"
              "https://khuonmauhoalong.files.wordpress.com/${upload_path}"
              "$url"
            )
            downloaded=false
            for candidate in "${candidates[@]}"; do
              echo "Trying source for $filename: $candidate"
              if curl --fail --location --silent --show-error --max-time 40 \
                --retry 1 --retry-all-errors \
                --referer "https://khuonmauhoalong.wordpress.com/" \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36" \
                "$candidate" --output "$stage/$filename"; then
                downloaded=true
                break
              fi
              rm -f "$stage/$filename"
            done
            [ "$downloaded" = true ] || { echo "Could not download $filename from any WordPress image endpoint."; exit 1; }
            mime="$(file --brief --mime-type "$stage/$filename")"
            case "$mime" in
              image/jpeg|image/png) ;;
              *) echo "Unexpected image type for $filename: $mime"; exit 1 ;;
            esac
            size="$(wc -c < "$stage/$filename")"
            [ "$size" -gt 1000 ] || { echo "File too small: $filename"; exit 1; }
            count=$((count + 1))
          done < "$map_file"

          [ "$count" -eq 17 ] || { echo "Expected 17 images, got $count"; exit 1; }
          echo "Validated $count original images."

          mkdir -p assets/images/wordpress-legacy
          cp "$stage"/* assets/images/wordpress-legacy/

      - name: Replace remote image URLs in all site pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - ".wp-image-map.txt" <<'PY'
          import pathlib
          import sys

          mapping = {}
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if not line:
                  continue
              filename, url = line.split("|", 1)
              mapping[url] = f"./assets/images/wordpress-legacy/{filename}"

          pages = [
              "index.html",
              "gioi-thieu.html",
              "khach-hang.html",
              "khuon-mau.html",
              "lien-he.html",
              "may-moc.html",
              "san-pham-co-khi.html",
              "san-pham-gia-cong.html",
          ]
          replacements = {url: 0 for url in mapping}
          rewritten = {}
          for name in pages:
              path = pathlib.Path(name)
              content = path.read_text(encoding="utf-8")
              for url, local_path in mapping.items():
                  n = content.count(url)
                  if n:
                      replacements[url] += n
                      content = content.replace(url, local_path)
              rewritten[path] = content

          missing = [url for url, count in replacements.items() if count == 0]
          if missing:
              raise SystemExit("No HTML reference found for: " + ", ".join(missing))

          for path, content in rewritten.items():
              path.write_text(content, encoding="utf-8")

          print(f"Rewrote {sum(replacements.values())} references across {len(pages)} pages.")
          PY

          if grep -R -n "khuonmauhoalong.wordpress.com/wp-content/uploads" --include="*.html" .; then
            echo "Some remote image references remain; refusing to commit."
            exit 1
          fi

      - name: Commit local images and updated pages
        shell: bash
        run: |
          set -euo pipefail
          rm -f .wp-image-map.txt
          git rm -f .github/workflows/import-wordpress-images.yml
          git add assets/images/wordpress-legacy index.html gioi-thieu.html khach-hang.html khuon-mau.html lien-he.html may-moc.html san-pham-co-khi.html san-pham-gia-cong.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import legacy WordPress images into site assets"
          git push origin HEAD:main
